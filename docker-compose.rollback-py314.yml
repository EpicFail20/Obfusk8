# ---------------------------------------------------------------------------
# Rollback of the Python phase (analyzer rebuilt on our own Python base,
# Python 3.14, see docs/phase-python-report.md, "Retour arrière"). Runs the
# stack on the images that were in service before the phase, kept under local
# tags (never pushed, never pulled):
#   docker compose -f docker-compose.yml -f docker-compose.rollback-py314.yml up -d
# Back to the current images:
#   docker compose up -d
#
# Image IDs at tagging time (2026-10-07; containerd image store: index digest,
# the running containers' manifest digest being the one of these tags): app
# fb6a03e6... (manifest d41914de...), analyzer 9a5e59a0... (manifest
# 8b0a4a6d...), traefik 24841fe2..., keycloak b0f60d48..., oauth2-proxy
# 8498b0d0..., docker-socket-proxy 1f5038b5..., busybox fd7dc986...
# Configuration stays the current one; a full configuration rollback is
# `git checkout 879d246 -- <files>`, outside this file.
# `pull_policy: never`: these local tags must never be resolved on a registry
# (a namespace such as obfusk8-local/ could be registered by anyone).
# ---------------------------------------------------------------------------
services:
  app:
    image: obfusk8-local:avant-py314-app
    pull_policy: never
  presidio-analyzer:
    image: obfusk8-local:avant-py314-presidio-analyzer
    pull_policy: never
  traefik:
    image: obfusk8-local:avant-py314-traefik
    pull_policy: never
  keycloak:
    image: obfusk8-local:avant-py314-keycloak
    pull_policy: never
  oauth2-proxy:
    image: obfusk8-local:avant-py314-oauth2-proxy
    pull_policy: never
  docker-socket-proxy:
    image: obfusk8-local:avant-py314-docker-socket-proxy
    pull_policy: never
  fix-app-dirs-perms:
    image: obfusk8-local:avant-py314-fix-app-dirs-perms
    pull_policy: never
