version: "3.9"

# ---------------------------------------------------------------------------
# Stack d'anonymisation de documents - variante LAB (test sur VM Proxmox)
# Identique au stack cible, sauf l'authentification : Keycloak remplace
# Entra ID le temps du test (même protocole OIDC via oauth2-proxy -> quand
# tu passeras en entreprise, seules les 3 valeurs d'env OIDC_* changent).
# ---------------------------------------------------------------------------

networks:
  frontend:
    driver: bridge
    # NON-internal : seul Traefik y est rattaché, pour conserver la
    # publication des ports 80/443 vers l'hôte (Docker ne publie pas les
    # ports d'un réseau internal:true — testé et confirmé cette session).
  app-internal:
    driver: bridge
    internal: true   # app, oauth2-proxy, keycloak — aucun accès internet direct.
                      # ATTENTION AU PASSAGE À ENTRA ID : oauth2-proxy devra alors
                      # atteindre les serveurs Microsoft. Revoir ce réseau à ce
                      # moment-là (le sortir vers un réseau non-internal dédié).
  backend:
    driver: bridge
    internal: true   # aucun accès internet direct pour les services internes
  docker-proxy:
    driver: bridge
    internal: true   # isole Traefik <-> docker-socket-proxy, rien d'autre dessus

volumes:
  traefik-certs:
  keycloak-data:

secrets:
  oauth2_client_secret:
    file: ./secrets/oauth2_client_secret.txt
  oauth2_cookie_secret:
    file: ./secrets/oauth2_cookie_secret.txt
  keycloak_admin_password:
    file: ./secrets/keycloak_admin_password.txt

services:

  # -------------------------------------------------------------------------
  # Proxy Docker en lecture seule pour Traefik - seul ce conteneur touche
  # directement /var/run/docker.sock. N'expose que 3 catégories d'API
  # (CONTAINERS, NETWORKS, EVENTS) ; tout le reste (EXEC, POST, IMAGES,
  # VOLUMES, SECRETS, SWARM...) reste bloqué par défaut (403).
  # -------------------------------------------------------------------------
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    environment:
      - CONTAINERS=1
      - NETWORKS=1
      - EVENTS=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-proxy

  # -------------------------------------------------------------------------
  # Reverse proxy + TLS interne
  # -------------------------------------------------------------------------
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp
      - /run
    command:
      - "--providers.docker=true"
      - "--providers.docker.endpoint=tcp://docker-socket-proxy:2375"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--global.checknewversion=false"
      - "--global.sendanonymoususage=false"
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/certs:/etc/traefik/certs:ro
    networks:
      - frontend
      - app-internal
      - docker-proxy
    depends_on:
      - docker-socket-proxy

  # -------------------------------------------------------------------------
  # Keycloak - simule Entra ID en lab via le protocole OIDC standard
  # Admin console: http://<ip-vm>:8080 (LAB UNIQUEMENT)
  # -------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Keycloak n'a pas de variante "_FILE" native fiable pour le mot de passe
    # admin (contrairement à oauth2-proxy) : on lit le secret depuis le
    # fichier monté par Docker au démarrage, dans une variable d'env locale
    # au conteneur, jamais visible via `docker inspect`.
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        export KC_BOOTSTRAP_ADMIN_PASSWORD="$(cat /run/secrets/keycloak_admin_password)"
        exec /opt/keycloak/bin/kc.sh start-dev
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_HOSTNAME=http://keycloak.lab.local:8080
    secrets:
      - keycloak_admin_password
    ports:
      - "8080:8080"   # console admin exposée directement pour le lab
    volumes:
      - keycloak-data:/opt/keycloak/data
    networks:
      frontend: {}   # nécessaire pour la publication du port 8080 (navigateur -> connexion)
      app-internal:
        aliases:
          - keycloak.lab.local   # pour qu'oauth2-proxy le joigne en interne

  # -------------------------------------------------------------------------
  # Authentification OIDC devant l'app (Keycloak en lab, Entra ID en prod)
  # -------------------------------------------------------------------------
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4   # v7.6.0 était très en retard (CVE + pas de cookie_secret_file)
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env   # ne contient plus que des valeurs non sensibles (APP_DOMAIN, OAUTH2_PROXY_CLIENT_ID)
    environment:
      - OAUTH2_PROXY_CLIENT_SECRET_FILE=/run/secrets/oauth2_client_secret
      - OAUTH2_PROXY_COOKIE_SECRET_FILE=/run/secrets/oauth2_cookie_secret
    secrets:
      - oauth2_client_secret
      - oauth2_cookie_secret
    volumes:
      - ./oauth2-proxy/oauth2-proxy.cfg:/etc/oauth2-proxy.cfg:ro
    command: ["--config=/etc/oauth2-proxy.cfg"]
    depends_on:
      - keycloak
    networks:
      - app-internal
    labels:
      - "traefik.http.middlewares.oauth2-errors.errors.status=401-403"
      - "traefik.http.middlewares.oauth2-errors.errors.service=auth@docker"
      - "traefik.http.middlewares.oauth2-errors.errors.query=/oauth2/sign_in?rd={url}"
      - "traefik.http.middlewares.oauth2-errors.errors.statusRewrites.401=302"
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=Host(`${APP_DOMAIN}`) && PathPrefix(`/oauth2`)"
      - "traefik.http.routers.auth.entrypoints=websecure"
      - "traefik.http.routers.auth.tls=true"
      - "traefik.http.services.auth.loadbalancer.server.port=4180"
      - "traefik.docker.network=anonymiseur_app-internal"
      - "traefik.http.middlewares.oidc-auth.forwardauth.address=http://oauth2-proxy:4180/oauth2/auth"
      - "traefik.http.middlewares.oidc-auth.forwardauth.trustForwardHeader=true"
      - "traefik.http.middlewares.oidc-auth.forwardauth.authResponseHeaders=X-Auth-Request-User,X-Auth-Request-Email"

  # -------------------------------------------------------------------------
  # Application (frontend + API)
  # -------------------------------------------------------------------------
  app:
    build: ./app
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    environment:
      - PRESIDIO_ANALYZER_URL=http://presidio-analyzer:3000
      - PRESIDIO_ANONYMIZER_URL=http://presidio-anonymizer:3000
      - MAX_UPLOAD_MB=25
      - FILE_TTL_SECONDS=180
      - JOB_REVIEW_TTL_SECONDS=600
      - MAX_PDF_PAGES=70
      - MAX_DOCX_PARAGRAPHS=5000
      - MAX_DOCX_UNCOMPRESSED_MB=200
      - MAX_DOCX_ZIP_RATIO=100
      - MAX_CSV_ROWS=20000
      - MAX_CSV_CELLS=5000
      - MAX_CSV_FIELD_CHARS=100000
      # IMPORTANT : le score ne peut PAS distinguer un vrai nom d'un mot
      # administratif ordinaire — les deux partagent le même score fixe
      # (0.85) attribué par le reconnaisseur spaCy de Presidio, qui ne
      # fournit pas de confiance réellement calibrée par détection. Un seuil
      # au-dessus de 0.85 élimine donc la détection PERSON/LOCATION
      # générique EN BLOC dès qu'aucun thème n'est sélectionné — vrais noms
      # (PDF médical inclus) compris. Testé et confirmé dangereux : des
      # informations confidentielles sont passées inaperçues sur un PDF réel
      # avec ce réglage. Un faux positif se corrige en un clic en révision ;
      # un faux négatif, lui, passe inaperçu et fuite silencieusement — ne
      # jamais arbitrer en faveur de moins de faux positifs si ça coûte des
      # faux négatifs. Revenu à 0.4, cohérent avec le seuil déjà utilisé par
      # tous les thèmes existants (medical/it/compta). N'affecte QUE le flux
      # "Aucun thème" ; les thèmes définissent chacun leur propre valeur.
      - DEFAULT_SCORE_THRESHOLD=0.4
      # LAB UNIQUEMENT — journal de débogage avec texte détecté en clair,
      # téléchargeable via /api/debug/log. À repasser à false (ou retirer)
      # avant toute mise en production.
      - ENABLE_DEBUG_LOG=true
      # Purge les entrées du journal de debug plus vieilles que ce délai
      # (secondes) — complète la rotation par taille, qui ne garantit
      # aucune limite temporelle. 3600 = 1h, ajustable.
      - DEBUG_LOG_TTL_SECONDS=3600
    volumes:
      - /var/lib/anonymiseur/workdir:/data/tmp
      - /var/log/anonymiseur-audit:/data/audit
      - /var/log/anonymiseur-debug:/data/debug
    networks:
      - app-internal
      - backend
    labels:
      - "traefik.http.routers.app-upload.rule=Host(`${APP_DOMAIN}`) && (PathPrefix(`/api/detect`) || PathPrefix(`/api/finalize`))"
      - "traefik.http.routers.app-upload.entrypoints=websecure"
      - "traefik.http.routers.app-upload.tls=true"
      - "traefik.http.routers.app-upload.priority=100"
      - "traefik.http.routers.app.priority=1"
      - "traefik.http.routers.app-upload.middlewares=oauth2-errors,oidc-auth,upload-ratelimit"
      - "traefik.http.routers.app-upload.service=app"
      - "traefik.http.middlewares.upload-ratelimit.ratelimit.average=5"
      - "traefik.http.middlewares.upload-ratelimit.ratelimit.period=1m"
      - "traefik.http.middlewares.upload-ratelimit.ratelimit.burst=10"
      - "traefik.http.routers.app.middlewares=oauth2-errors,oidc-auth"
      - "traefik.docker.network=anonymiseur_app-internal"
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.app.entrypoints=websecure"
      - "traefik.http.routers.app.tls=true"
      - "traefik.http.services.app.loadbalancer.server.port=8000"
    depends_on:
      - presidio-analyzer
      - presidio-anonymizer

  # -------------------------------------------------------------------------
  # Moteur de détection PII
  # -------------------------------------------------------------------------
  presidio-analyzer:
    build: ./presidio/analyzer-build
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /home/presidio/.gunicorn
      - /run/lock
      - /var/tmp
    environment:
      - PYTHONDONTWRITEBYTECODE=1
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2G

  # -------------------------------------------------------------------------
  # Moteur d'anonymisation
  # -------------------------------------------------------------------------
  presidio-anonymizer:
    image: ghcr.io/data-privacy-stack/presidio-anonymizer:2.2.364
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /home/presidio/.gunicorn
      - /run/lock
      - /var/tmp
    environment:
      - PYTHONDONTWRITEBYTECODE=1
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
