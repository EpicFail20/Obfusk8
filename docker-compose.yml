version: "3.9"

# ---------------------------------------------------------------------------
# Document anonymization stack - LAB variant (test on Proxmox VM)
# Identical to the target stack, except for authentication: Keycloak replaces
# Entra ID for the duration of testing (same OIDC protocol via oauth2-proxy ->
# once you move to production, only the 3 OIDC_* env values change).
# ---------------------------------------------------------------------------

networks:
  frontend:
    driver: bridge
    # NON-internal: only Traefik is attached to it, to preserve
    # publication of ports 80/443 to the host (Docker does not publish
    # ports of an internal:true network — tested and confirmed this session).
  app-internal:
    driver: bridge
    internal: true   # app, oauth2-proxy, keycloak — no direct internet access.
                      # WARNING WHEN MOVING TO ENTRA ID: oauth2-proxy will then need
                      # to reach the Microsoft servers. Revisit this network at that
                      # point (move it to a dedicated non-internal network).
  backend:
    driver: bridge
    internal: true   # no direct internet access for internal services
  docker-proxy:
    driver: bridge
    internal: true   # isolates Traefik <-> docker-socket-proxy, nothing else on it

volumes:
  traefik-certs:
  keycloak-data:

secrets:
  oauth2_client_secret:
    file: ./secrets/oauth2_client_secret.txt
  oauth2_cookie_secret:
    file: ./secrets/oauth2_cookie_secret.txt
  keycloak_admin_password:
    file: ./secrets/keycloak_admin_password.txt
  # Gateway shared secret (audit 3.7): known to Traefik (injected via the
  # gitignored dynamic file traefik/dynamic/gateway-secret.yml) and to
  # `app` (checked by the _GatewaySecretMiddleware middleware). Prevents a
  # neighboring container on the same Docker network from reaching `app` by
  # bypassing Traefik/oauth2-proxy and forging X-Auth-Request-Email. Generated by
  # generate-secrets.sh, never in clear text here.
  gateway_secret:
    file: ./secrets/gateway_secret.txt

services:

  # -------------------------------------------------------------------------
  # Read-only Docker proxy for Traefik - only this container touches
  # /var/run/docker.sock directly. Exposes only 3 API categories
  # (CONTAINERS, NETWORKS, EVENTS); everything else (EXEC, POST, IMAGES,
  # VOLUMES, SECRETS, SWARM...) stays blocked by default (403).
  # -------------------------------------------------------------------------
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    environment:
      - CONTAINERS=1
      - NETWORKS=1
      - EVENTS=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-proxy

  # -------------------------------------------------------------------------
  # Reverse proxy + internal TLS
  # -------------------------------------------------------------------------
  traefik:
    image: traefik:v3.7.13   # v3.6 EOL since v3.6.25 (2026-07-31, no more patches); 3.7 is the maintained stable line
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev
      - /var/tmp:noexec,nosuid,nodev
      - /run:noexec,nosuid,nodev
    command:
      - "--providers.docker=true"
      - "--providers.docker.endpoint=tcp://docker-socket-proxy:2375"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--global.checknewversion=false"
      - "--global.sendanonymoususage=false"
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/certs:/etc/traefik/certs:ro
    networks:
      - frontend
      - app-internal
      - docker-proxy
    depends_on:
      - docker-socket-proxy

  # -------------------------------------------------------------------------
  # Keycloak - simulates Entra ID in lab via the standard OIDC protocol
  # Admin console: http://<vm-ip>:8080 (LAB ONLY)
  # -------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Keycloak has no reliable native "_FILE" variant for the admin
    # password (unlike oauth2-proxy): we read the secret from the
    # file mounted by Docker at startup, into an env var local
    # to the container, never visible via `docker inspect`.
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        export KC_BOOTSTRAP_ADMIN_PASSWORD="$(cat /run/secrets/keycloak_admin_password)"
        exec /opt/keycloak/bin/kc.sh start-dev
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_HOSTNAME=http://keycloak.lab.local:8080
    secrets:
      - keycloak_admin_password
    ports:
      - "8080:8080"   # admin console exposed directly for the lab
    volumes:
      - keycloak-data:/opt/keycloak/data
    networks:
      frontend: {}   # needed for publishing port 8080 (browser -> login)
      app-internal:
        aliases:
          - keycloak.lab.local   # so oauth2-proxy can reach it internally
    # Without this, `depends_on` (on the oauth2-proxy side) only waits for the
    # CONTAINER to start, not for the HTTP port to respond — Keycloak (JVM) takes
    # significantly longer to initialize than oauth2-proxy waits before attempting its
    # one-shot OIDC discovery at startup, causing a systematic crash-loop of
    # oauth2-proxy on every full stack restart (observed:
    # RestartCount=7, always the same connection-refused error).
    # No curl/wget/python in this image (minimal RHEL): bare TCP test
    # via /dev/tcp, native to bash (the service's entrypoint is already bash).
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && exec 3<&-"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s

  # -------------------------------------------------------------------------
  # OIDC authentication in front of the app (Keycloak in lab, Entra ID in prod)
  # -------------------------------------------------------------------------
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4   # v7.6.0 was far behind (CVE + no cookie_secret_file)
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Hardening aligned with app/presidio/traefik (audit 2.2): static Go
    # binary, non-root image user, unprivileged port 4180,
    # no disk writes (cookie-based sessions) — no capability required.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev
    env_file:
      - .env   # now only contains non-sensitive values (APP_DOMAIN, OAUTH2_PROXY_CLIENT_ID)
    environment:
      - OAUTH2_PROXY_CLIENT_SECRET_FILE=/run/secrets/oauth2_client_secret
      - OAUTH2_PROXY_COOKIE_SECRET_FILE=/run/secrets/oauth2_cookie_secret
    secrets:
      - oauth2_client_secret
      - oauth2_cookie_secret
    volumes:
      - ./oauth2-proxy/oauth2-proxy.cfg:/etc/oauth2-proxy.cfg:ro
    command: ["--config=/etc/oauth2-proxy.cfg"]
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - app-internal
    labels:
      - "traefik.http.middlewares.oauth2-errors.errors.status=401-403"
      - "traefik.http.middlewares.oauth2-errors.errors.service=auth@docker"
      - "traefik.http.middlewares.oauth2-errors.errors.query=/oauth2/sign_in?rd={url}"
      - "traefik.http.middlewares.oauth2-errors.errors.statusRewrites.401=302"
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=Host(`${APP_DOMAIN}`) && PathPrefix(`/oauth2`)"
      - "traefik.http.routers.auth.entrypoints=websecure"
      - "traefik.http.routers.auth.tls=true"
      - "traefik.http.services.auth.loadbalancer.server.port=4180"
      - "traefik.docker.network=anonymiseur_app-internal"
      - "traefik.http.middlewares.oidc-auth.forwardauth.address=http://oauth2-proxy:4180/oauth2/auth"
      - "traefik.http.middlewares.oidc-auth.forwardauth.trustForwardHeader=true"
      - "traefik.http.middlewares.oidc-auth.forwardauth.authResponseHeaders=X-Auth-Request-User,X-Auth-Request-Email"
      # Traefik 3.7 warns at startup if the auth server's response size
      # is not bounded (unbounded in-memory read).
      # oauth2-proxy responds empty (202) or with a small page (401); 1 MB is
      # very generous and removes the vector in case the auth server is
      # compromised. Beyond that, Traefik rejects the request (never "lets it through").
      - "traefik.http.middlewares.oidc-auth.forwardauth.maxResponseBodySize=1048576"

  # -------------------------------------------------------------------------
  # Application (frontend + API)
  # -------------------------------------------------------------------------
  app:
    build: ./app
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
      # Custom seccomp profile (replaces Docker's default
      # profile), built from the syscalls actually observed via
      # strace on this service (startup, detect/finalize PDF/DOCX/CSV, error
      # cases, deferred purge, clean shutdown) + the runc bootstrap syscalls
      # required for any non-root container with cap_drop:ALL — see
      # seccomp/README.md for the full method.
      #
      # ACTUAL ENFORCEMENT (SCMP_ACT_ERRNO): the logging-only phase
      # (app-audit.json) revealed no missing legitimate syscall. If a
      # legitimate need arises later (new document format, PyMuPDF/python-docx
      # upgrade...), fall back to app-audit.json while
      # replaying the scenarios to identify the missing syscall via
      # `dmesg | grep 'audit: type=1326'`.
      - seccomp=./seccomp/app-enforce.json
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev
    # Task cap (processes + threads) for the container. Since image
    # support (OCR) was added, this service can spawn subprocesses (tesseract); in
    # case of process compromise, a fork bomb was only bounded by
    # the systemd default (~9500 tasks on this host). Measured under
    # real conditions: 7 tasks at peak during the entire test suite
    # (OCR included); the Starlette thread pool can go up to ~40. 256
    # leaves a very wide margin while making exhaustion impossible.
    # (declared under deploy.resources.limits.pids: compose refuses the
    # short form `pids_limit` once deploy.resources.limits is already defined.)
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
          pids: 256
    environment:
      - PRESIDIO_ANALYZER_URL=http://presidio-analyzer:3000
      - PRESIDIO_ANONYMIZER_URL=http://presidio-anonymizer:3000
      # UI_LANG: interface language, must match one of the files present
      # in app/i18n/ (currently "fr", "en") — see docs/traduire-interface.md.
      # Falls back to French if the file is missing or unreadable.
      - UI_LANG=fr
      - MAX_UPLOAD_MB=25
      - FILE_TTL_SECONDS=180
      - JOB_REVIEW_TTL_SECONDS=600
      - MAX_PDF_PAGES=70
      - MAX_DOCX_PARAGRAPHS=5000
      - MAX_DOCX_UNCOMPRESSED_MB=200
      - MAX_DOCX_ZIP_RATIO=100
      - MAX_CSV_ROWS=20000
      - MAX_CSV_CELLS=5000
      - MAX_CSV_FIELD_CHARS=100000
      # IMPORTANT: the score CANNOT distinguish a real name from an
      # ordinary administrative word — both share the same fixed score
      # (0.85) assigned by Presidio's spaCy recognizer, which does not
      # provide confidence that is actually calibrated per detection. A threshold
      # above 0.85 therefore eliminates generic PERSON/LOCATION detection
      # ENTIRELY as soon as no theme is selected — including real names
      # (medical PDF included). Tested and confirmed dangerous: confidential
      # information went unnoticed on a real PDF with this
      # setting. A false positive is fixed with one click during review;
      # a false negative, on the other hand, goes unnoticed and leaks silently — never
      # trade off fewer false positives if it costs
      # false negatives. Reverted to 0.4, consistent with the threshold already used by
      # all existing themes (medical/it/accounting). Affects ONLY the
      # "No theme" flow; each theme defines its own value.
      - DEFAULT_SCORE_THRESHOLD=0.4
      # --- Antivirus scan (see app/antivirus.py) ---
      # AV_ENGINE: engine used to scan each file before any
      # PDF/DOCX/CSV parsing. "none" (current default) fully disables
      # scanning regardless of the AV_ENFORCE value below — the two
      # settings are independent, but AV_ENGINE=none makes AV_ENFORCE have no
      # effect. Only other supported value: "icap" (RFC 3507 ICAP server
      # already deployed on the client's infrastructure, see ICAP_* below).
      - AV_ENGINE=none
      # AV_ENFORCE: what to do with an unfavorable antivirus verdict (threat
      # detected OR ICAP engine unreachable). true (default if a real engine
      # is ever activated) = blocks the file (HTTPException). false = observation
      # mode, the file continues normal processing but an
      # explicit warning is logged (never a silent failure).
      - AV_ENFORCE=true
      # ICAP_HOST: host of the ICAP server to contact. Required only if
      # AV_ENGINE=icap (see antivirus.py: a plain FortiGate client is
      # NOT a valid ICAP server, confirm with the security team).
      - ICAP_HOST=
      # ICAP_PORT: ICAP server port (1344 is the standard RFC 3507 port).
      - ICAP_PORT=1344
      # ICAP_SERVICE: name of the ICAP service exposed by the server (depends
      # on its configuration, e.g. "avscan" for c-icap/SquidClamav).
      - ICAP_SERVICE=avscan
      # ICAP_TIMEOUT_SECONDS: maximum time to wait for a response from the
      # ICAP server before considering the scan unavailable.
      - ICAP_TIMEOUT_SECONDS=30
      # ICAP_TLS: true to encrypt the connection to the ICAP server (ICAPS).
      - ICAP_TLS=false
      # --- Supervision/alerting (see app/supervision.py) ---
      # ALERT_SINK: destination of operational alerts (antivirus
      # unavailable/threat, low disk space, Presidio unreachable...).
      # "none" (default) logs locally without forwarding — switch to
      # "syslog" once a SIEM collector is available on the client's
      # infrastructure (same logic as AV_ENGINE=none above: the component is
      # ready, activation is waiting on the real infrastructure).
      - ALERT_SINK=none
      - SYSLOG_HOST=
      - SYSLOG_PORT=514
      - SYSLOG_TCP=false
    volumes:
      - /var/lib/anonymiseur/workdir:/data/tmp
      - /var/log/anonymiseur-audit:/data/audit
    # Gateway shared secret (audit 3.7), mounted by Docker at
    # /run/secrets/gateway_secret (default path read by main.py). Checked
    # by _GatewaySecretMiddleware before any request processing.
    secrets:
      - gateway_secret
    networks:
      - app-internal
      - backend
    labels:
      - "traefik.http.routers.app-upload.rule=Host(`${APP_DOMAIN}`) && (PathPrefix(`/api/detect`) || PathPrefix(`/api/finalize`))"
      - "traefik.http.routers.app-upload.entrypoints=websecure"
      - "traefik.http.routers.app-upload.tls=true"
      - "traefik.http.routers.app-upload.priority=100"
      - "traefik.http.routers.app.priority=1"
      - "traefik.http.routers.app-upload.middlewares=oauth2-errors,oidc-auth,upload-ratelimit,upload-bodylimit,gateway-secret@file"
      - "traefik.http.routers.app-upload.service=app"
      - "traefik.http.middlewares.upload-ratelimit.ratelimit.average=5"
      - "traefik.http.middlewares.upload-ratelimit.ratelimit.period=1m"
      - "traefik.http.middlewares.upload-ratelimit.ratelimit.burst=10"
      # Request body size cap AT THE EDGE (defense in depth alongside
      # the same cap applied inside the application, see
      # MAX_REQUEST_BODY_BYTES in main.py): an oversized upload is
      # rejected with 413 by Traefik without ever reaching the app's
      # single worker. Without either of these two caps, a single 700 MB
      # upload killed the app container via OOM (reproduced on a throwaway container).
      # 27 MB = MAX_UPLOAD_MB (25) + 2 MB of multipart/field overhead — to
      # realign if MAX_UPLOAD_MB changes. Beyond memRequestBodyBytes,
      # Traefik buffers to /tmp (the traefik container's tmpfs).
      - "traefik.http.middlewares.upload-bodylimit.buffering.maxRequestBodyBytes=28311552"
      - "traefik.http.middlewares.upload-bodylimit.buffering.memRequestBodyBytes=1048576"
      # Dedicated router for /api/preview_image: CPU-bound rendering of a page of
      # the original document (get_pixmap), previously with no rate limiting
      # at all (only /api/detect and /api/finalize had any). Thresholds distinct from
      # upload-ratelimit: a review legitimately loads up to
      # MAX_PDF_PAGES (70) previews at once, hence a large burst; the
      # average bounds continuous abuse. Same authentication as the rest.
      - "traefik.http.routers.app-preview.rule=Host(`${APP_DOMAIN}`) && PathPrefix(`/api/preview_image`)"
      - "traefik.http.routers.app-preview.entrypoints=websecure"
      - "traefik.http.routers.app-preview.tls=true"
      - "traefik.http.routers.app-preview.priority=100"
      - "traefik.http.routers.app-preview.middlewares=oauth2-errors,oidc-auth,preview-ratelimit,gateway-secret@file"
      - "traefik.http.routers.app-preview.service=app"
      - "traefik.http.middlewares.preview-ratelimit.ratelimit.average=120"
      - "traefik.http.middlewares.preview-ratelimit.ratelimit.period=1m"
      - "traefik.http.middlewares.preview-ratelimit.ratelimit.burst=150"
      # Dedicated router for /metrics: a Prometheus scraper cannot do
      # the oidc-auth OAuth dance (see main.py, /metrics endpoint) — but
      # Traefik remains exposed to the Internet (non-internal frontend network),
      # so this endpoint can't be left open to anyone regardless:
      # ipallowlist restricts it to the real monitoring server's
      # addresses. "127.0.0.1/32" by default = no one from
      # the outside until it's explicitly opened to the Prometheus
      # collector's address once it is deployed.
      - "traefik.http.routers.app-metrics.rule=Host(`${APP_DOMAIN}`) && PathPrefix(`/metrics`)"
      - "traefik.http.routers.app-metrics.entrypoints=websecure"
      - "traefik.http.routers.app-metrics.tls=true"
      - "traefik.http.routers.app-metrics.priority=100"
      - "traefik.http.routers.app-metrics.middlewares=metrics-allowlist,gateway-secret@file"
      - "traefik.http.routers.app-metrics.service=app"
      - "traefik.http.middlewares.metrics-allowlist.ipallowlist.sourcerange=127.0.0.1/32"
      - "traefik.http.routers.app.middlewares=oauth2-errors,oidc-auth,gateway-secret@file"
      - "traefik.docker.network=anonymiseur_app-internal"
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.app.entrypoints=websecure"
      - "traefik.http.routers.app.tls=true"
      - "traefik.http.services.app.loadbalancer.server.port=8000"
    depends_on:
      - presidio-analyzer
      - presidio-anonymizer

  # -------------------------------------------------------------------------
  # PII detection engine
  # -------------------------------------------------------------------------
  presidio-analyzer:
    build: ./presidio/analyzer-build
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev
      - /home/presidio/.gunicorn:noexec,nosuid,nodev
      - /run/lock:noexec,nosuid,nodev
      - /var/tmp:noexec,nosuid,nodev
    environment:
      - PYTHONDONTWRITEBYTECODE=1
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2G

  # -------------------------------------------------------------------------
  # Anonymization engine
  # -------------------------------------------------------------------------
  presidio-anonymizer:
    image: ghcr.io/data-privacy-stack/presidio-anonymizer:2.2.364
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev
      - /home/presidio/.gunicorn:noexec,nosuid,nodev
      - /run/lock:noexec,nosuid,nodev
      - /var/tmp:noexec,nosuid,nodev
    environment:
      - PYTHONDONTWRITEBYTECODE=1
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
