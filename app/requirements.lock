# Hash-locked production dependencies of the app image (EXT-01, phase 2 bis).
# Regenerated on 2026-10-07 for Python 3.14.8 (Python phase, D-052; same
# versions as on 2026-10-06, only the compiled wheels changed: charset-
# normalizer, httptools, lxml, pillow, pydantic-core, pyyaml, uvloop,
# websockets) from requirements.txt (top-level pins) with:
#   pip install --dry-run --ignore-installed --only-binary=:all: --report report.json \
#       -r requirements.txt -c constraints.txt
# inside the image base (PYTHON_BASE, docker-compose.build.yml), with pip from
# requirements-build.txt. constraints.txt = the previous lock's versions, minus
# the packages being updated (pinned to their target version), so that an
# update only moves what it is meant to move; then one line per entry of the
# report's "install" list: name==version and the SHA-256 of the chosen wheel.
# The compiled wheels are specific to the Python minor version of the base:
# changing Python means regenerating this file (docs/maintenance-dependances.md).
# Deliberate gaps to the latest release: docs/DECISIONS.md (D-043: fastapi).
# Installed by the Dockerfile with:
#   pip install --require-hashes --no-deps -r requirements.lock
