# Development tool configuration only (the image installs requirements.txt
# and never reads this file). Tools: requirements-dev.txt, run in an
# isolated environment (docs/DECISIONS.md D-016).
#
# Scope: lint/format/strict typing apply to the files created from phase 1
# on, passed explicitly on the command line — existing files are NOT
# reformatted (CLAUDE.md §4: a global reformat would bury the real changes).

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "RUF", "SIM", "PL"]
ignore = ["PLR0913"]  # dependency-injection constructors take many keyword arguments

[tool.ruff.lint.isort]
# The app's own modules (flat layout in app/): stable import order whatever
# directory ruff is run from.
known-first-party = ["main", "metrics", "supervision", "antivirus", "branding", "text_api", "text_api_models", "obfusk8_client"]

[tool.ruff.lint.per-file-ignores]
# Tests: pytest asserts, literal expected values, local imports, and
# deliberately ambiguous Unicode (placeholders, typographic characters are
# what is being tested).
"**/tests/*" = ["S101", "PLR2004", "S105", "S106", "PLC0415", "PLR0917", "RUF001"]
# End-to-end scripts: HTTP status literals and typographic characters are
# exactly what they check.
"**/e2e/*" = ["PLR2004", "RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
# main.py (existing, untyped) is imported by the tests only; modules from
# phase 1 on are checked strictly.
follow_imports = "silent"
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["main", "antivirus", "branding", "icap.*", "pymupdf", "pymupdf.*", "fitz.*", "docx.*", "pytesseract.*"]
ignore_errors = true
ignore_missing_imports = true

[tool.coverage.run]
branch = true
data_file = "/tmp/.coverage"

[[tool.mypy.overrides]]
# Calls into PyMuPDF (untyped) to build and read synthetic PDFs.
module = ["e2e_document_flow", "doc_zones_snapshot", "pdf_localization_bench", "doc_quality_bench", "e2e_pdf_localization"]
disallow_untyped_calls = false
warn_return_any = false

[[tool.mypy.overrides]]
# Reuses the untyped ASGI and upload helpers of test_main_units.py (existing,
# untyped) and builds a synthetic PDF with PyMuPDF (untyped).
module = ["tests.test_document_availability"]
disallow_untyped_calls = false
