# oauth2-proxy configuration - LAB (Keycloak) -> identical in prod with Entra ID
# by changing only oidc_issuer_url / client_id / client_secret.

provider = "oidc"
oidc_issuer_url = "http://keycloak.lab.local:8080/realms/lab"
# redirect_url is intentionally NOT set here. It's provided instead via
# the OAUTH2_PROXY_REDIRECT_URL environment variable in docker-compose.yml
# (derived from ${APP_DOMAIN}, same mechanism already relied upon below
# for client_id — env vars take priority over this file). Keeping it out
# of this file avoids the exact trap this project hit twice already:
# two sources defining the same setting, with the file's value being the
# one silently used after a domain change, because whoever updated .env
# had no reason to also come edit this file. If you ever see this
# project fail with an OAuth redirect_uri mismatch after changing
# APP_DOMAIN, check docker-compose.yml's OAUTH2_PROXY_REDIRECT_URL first
# — not this file.

client_id = "${OAUTH2_PROXY_CLIENT_ID}"
# client_secret and cookie_secret are provided via Docker secrets
# (OAUTH2_PROXY_CLIENT_SECRET_FILE / OAUTH2_PROXY_COOKIE_SECRET_FILE in
# docker-compose.yml) — do not put them here in clear text.
#
# General note about this file: oauth2-proxy (legacy .cfg) does NOT
# do ${VAR} interpolation — the client_id line above is therefore literal
# and has no effect; it's the OAUTH2_PROXY_CLIENT_ID env var (defined
# in .env, higher priority) that provides the real value. Functional
# as-is, but keep this in mind if you ever edit this line
# thinking it does something.

email_domains = ["*"]
cookie_secure = true
cookie_httponly = true
cookie_expire = "1h"
# Explicit SameSite: without it, Firefox (which does NOT apply "Lax by default",
# unlike Chrome) sends the session cookie on a POST form
# submission triggered from a third-party site (CSRF towards /api/detect or
# /api/finalize). "lax" stays compatible with the OIDC provider's return
# to /oauth2/callback (top-level GET navigation); "strict" would
# break it.
cookie_samesite = "lax"

# Group mimicking the future Entra group "SG-Anonymiseur-Utilisateurs"
allowed_groups = ["/SG-Anonymiseur-Utilisateurs"]

pass_access_token = false
pass_user_headers = true
set_xauthrequest = true

http_address = "0.0.0.0:4180"
reverse_proxy = true
