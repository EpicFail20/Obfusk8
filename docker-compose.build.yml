# ---------------------------------------------------------------------------
# Local build of the images built from this repository (D-040).
# docker-compose.yml pins images by digest, and Compose refuses to build an
# image whose reference contains a digest ("build tag cannot contain a
# digest", observed on 2026-10-05): the build context therefore lives here.
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml build
#   docker compose up -d
#
# `pull_policy: build`: never pull these tags from a registry, always build
# them from the Dockerfiles of this checkout.
# ---------------------------------------------------------------------------

# Python of BOTH built images, defined here only (Python phase, D-043 point 5,
# D-052 point 5): the PYTHON_BASE build argument of app/Dockerfile and
# presidio/analyzer-build/Dockerfile, which have no default (a build without
# it fails). python:3.14.8-slim = Python 3.14.8 on Debian 13 (trixie), latest
# stable Python every dependency supports (python.org, 2026-09-30), digest
# checked on Docker Hub on 2026-10-07. Changing it means regenerating both
# hash locks and updating the "python" version of versions.json and
# app/analyzer_versions.json (docs/maintenance-dependances.md); the analyzer
# build and app/tests/test_python_base.py fail otherwise. The publishing
# workflow (.github/workflows/docker-publish.yml) reads this line.
x-python-base: &python-base "python:3.14.8-slim@sha256:f85c5697265c178cc6887276c55fe16cf3d14ca35c3df6a5eab3b360534a55d2"

services:
  app:
    build:
      context: ./app
      args:
        PYTHON_BASE: *python-base
    pull_policy: build
  presidio-analyzer:
    build:
      context: ./presidio/analyzer-build
      args:
        PYTHON_BASE: *python-base
    pull_policy: build
