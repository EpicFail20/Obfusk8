# Full hash-locked Python environment of the analyzer image (D-043 point 3,
# phase 2 ter). Every distribution of the final image is declared here (the
# build fails otherwise, check_lock.py), installed over the digest-pinned
# Presidio base with:
#   pip install --require-hashes --no-deps -r requirements.lock
# Limit until the next phase (D-043 point 5): pip only downloads, and so only
# hash-checks, the entries whose version differs from the base; entries at
# the base's version are the files of the digest-pinned base image (upstream
# uv.lock). The next phase rebuilds the analyzer on a pinned Python base from
# this lock, every entry then being hash-checked.
#
# Generated on 2026-10-06 (docs/maintenance-dependances.md) inside the base
# image (FROM line of the Dockerfile), with pip from requirements-build.txt:
#   pip install --dry-run --ignore-installed --only-binary=:all: --report report.json \
#       -r names.txt -c constraints.txt
# names.txt = every distribution of the previous image except the two models;
# constraints.txt = their versions, the packages being updated pinned to their
# target version. The resolution must return exactly the constrained set.
# Capped by their dependents: numpy (presidio-analyzer: <2.5.0) and thinc
# (spacy 3.8: <8.4.0). gunicorn: 26.2.0 is the latest release on PyPI
# (26.2.1 and 26.2.2 are GitHub releases only on 2026-10-06).
