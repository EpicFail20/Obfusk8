# spaCy models: not on PyPI, GitHub release assets of explosion/spacy-models
# (fr_core_news_md 3.8.0 is the only release for spaCy 3.8). pip downloads
# them and rejects any other file; check_lock.py compares the SHA-256 recorded
# at install time. Limit (D-052 point 8): GitHub publishes no digest for these
# assets, so the hashes only prove "same files as before": en_core_web_lg's is
# the one recorded by the upstream Presidio image (direct_url.json),
# fr_core_news_md's the one of our phase 2 bis install; the installed model
# files were checked byte for byte against the previous image (Python phase).
