# Full hash-locked Python environment of the analyzer image (D-043 point 3,
# phase 2 ter; rebuilt on our own Python base in the Python phase, D-052).
# Every distribution of the image is declared here (the build fails
# otherwise, check_lock.py) and installed, every entry hash-checked, on the
# digest-pinned Python base (PYTHON_BASE, docker-compose.build.yml) with:
#   pip install --require-hashes --no-deps -r requirements.lock
# The compiled wheels are specific to the Python minor version of that base:
# changing Python means regenerating this file (docs/maintenance-dependances.md).
#
# Generated on 2026-10-07 inside the image base (PYTHON_BASE of
# docker-compose.build.yml, Python 3.14.8;
# same versions as for 3.12.15, only the compiled wheels changed), with pip
# from requirements-build.txt:
#   pip install --dry-run --ignore-installed --only-binary=:all: --report report.json \
#       -r names.txt -c constraints.txt
# names.txt = every entry of this file except the two models; constraints.txt =
# their versions. The resolution must return exactly the constrained set.
# presidio-analyzer: the library itself, from its PyPI wheel (same 179 files as
# the code of the upstream image 2.2.364, D-052 point 1); its REST server files
# are in server/. Capped by their dependents: numpy (presidio-analyzer:
# <2.5.0), thinc (spacy 3.8: <8.4.0), gunicorn (presidio-analyzer[server]:
# <26.0.0, EXT-60, D-052 point 3: 25.3.0, latest 25.x, no OSV advisory on
# 2026-10-07).
