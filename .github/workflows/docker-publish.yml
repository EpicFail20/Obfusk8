name: Publish Docker images

# Phase 2 bis (EXT-21, D-040): images are published ONLY for a release tag
# vX.Y.Z, under two immutable-by-convention tags: `X.Y.Z` and `sha-<commit>`.
# No more `main` / `latest` (floating tags, EXT-01): docker-compose.yml pins
# the published image by digest.
on:
  push:
    tags: ['v*.*.*']

# Nothing by default; each job requests only what it needs.
permissions: {}

jobs:
  build-app:
    runs-on: ubuntu-latest
    # Deployment environment (D-042): its protection rules (required reviewer,
    # tag-only deployment) are configured in Settings > Environments >
    # publication. No publication before the external pentest (D-041).
    environment: publication
    permissions:
      contents: read
      packages: write
    steps:
      # Third-party actions pinned by commit SHA (EXT-21), readable version in
      # the comment; checked on GitHub on 2026-10-05 (docs/DEPENDENCIES.md).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Base Python (docker-compose.build.yml, D-052)
        run: |
          base=$(sed -n 's/^x-python-base: &python-base "\(.*\)"$/\1/p' docker-compose.build.yml)
          test -n "$base"
          echo "PYTHON_BASE=$base" >> "$GITHUB_ENV"

      - name: Connexion à GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Métadonnées (app)
        id: meta-app
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-app
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short

      - name: Build et push (app)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./app
          build-args: PYTHON_BASE=${{ env.PYTHON_BASE }}
          push: true
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}

  build-presidio-analyzer:
    runs-on: ubuntu-latest
    # Deployment environment (D-042): its protection rules (required reviewer,
    # tag-only deployment) are configured in Settings > Environments >
    # publication. No publication before the external pentest (D-041).
    environment: publication
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Base Python (docker-compose.build.yml, D-052)
        run: |
          base=$(sed -n 's/^x-python-base: &python-base "\(.*\)"$/\1/p' docker-compose.build.yml)
          test -n "$base"
          echo "PYTHON_BASE=$base" >> "$GITHUB_ENV"

      - name: Connexion à GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Métadonnées (presidio-analyzer)
        id: meta-presidio
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-presidio-analyzer
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short

      - name: Build et push (presidio-analyzer)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./presidio/analyzer-build
          build-args: PYTHON_BASE=${{ env.PYTHON_BASE }}
          push: true
          tags: ${{ steps.meta-presidio.outputs.tags }}
          labels: ${{ steps.meta-presidio.outputs.labels }}
