name: Publish Docker images

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build-app:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Métadonnées (app)
        id: meta-app
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-app

      - name: Build et push (app)
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}

  build-presidio-analyzer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Métadonnées (presidio-analyzer)
        id: meta-presidio
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-presidio-analyzer

      - name: Build et push (presidio-analyzer)
        uses: docker/build-push-action@v5
        with:
          context: ./presidio/analyzer-build   # ⚠️ à corriger si le chemin réel diffère
          push: true
          tags: ${{ steps.meta-presidio.outputs.tags }}
          labels: ${{ steps.meta-presidio.outputs.labels }}
